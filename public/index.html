<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Coach</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2433; --muted: #5d6679;
    --accent: #3b5bdb; --accent-soft: #e7ecff; --border: #e2e5ee;
    --good: #2b8a3e; --good-soft: #e6f6ea; --bad: #c92a2a; --bad-soft: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2029; --text: #e6e9f0; --muted: #9aa3b5;
      --accent: #7c95ff; --accent-soft: #232b45; --border: #2a303c;
      --good: #69db7c; --good-soft: #1c2e22; --bad: #ff8787; --bad-soft: #3a2224;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  select, textarea, button { font: inherit; color: inherit; }
  select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; margin: 12px 0; padding: 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
  .primary { background: var(--accent); color: #fff; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .ghost { background: var(--accent-soft); color: var(--accent); }
  .ghost.rec { background: var(--bad-soft); color: var(--bad); }
  .hint { color: var(--muted); font-size: .85rem; }
  .error { background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 10px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .big { font-size: 1.35rem; font-weight: 650; margin: 0; }
  .lit { color: var(--muted); font-style: italic; margin: 8px 0 0; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  ul.clean { list-style: none; padding: 0; margin: 0; }
  ul.clean > li { padding: 10px 0; border-top: 1px solid var(--border); }
  ul.clean > li:first-child { border-top: 0; padding-top: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .8rem; font-weight: 600; border-top: 0; }
  .wrong { color: var(--bad); text-decoration: line-through; }
  .right { color: var(--good); font-weight: 600; }
  .example { background: var(--bg); border-radius: 8px; padding: 6px 10px; margin-top: 6px; font-style: italic; }
  .speak { background: none; padding: 4px 8px; color: var(--accent); font-size: 1.1rem; }
  .answer { display: none; margin-top: 10px; }
  .answer.show { display: block; }
  #history button { background: none; color: var(--accent); padding: 4px 0; font-weight: 500; text-align: left; }
  .loading { color: var(--muted); }
  @media (max-width: 560px) { td, th { font-size: .9rem; } }
</style>
</head>
<body>
<main>
  <h1>English Coach</h1>
  <p class="sub">Say or type a sentence in your own language. See how it's said in English, and why.</p>

  <section class="card">
    <div class="row">
      <label>Language
        <select id="language">
          <option value="">Auto-detect</option>
          <option value="Hindi" data-speech="hi-IN">Hindi</option>
          <option value="Hinglish (romanized Hindi)" data-speech="hi-IN">Hinglish</option>
          <option value="Bengali" data-speech="bn-IN">Bengali</option>
          <option value="Tamil" data-speech="ta-IN">Tamil</option>
          <option value="Telugu" data-speech="te-IN">Telugu</option>
          <option value="Marathi" data-speech="mr-IN">Marathi</option>
          <option value="Gujarati" data-speech="gu-IN">Gujarati</option>
          <option value="Punjabi" data-speech="pa-IN">Punjabi</option>
          <option value="Urdu" data-speech="ur-PK">Urdu</option>
          <option value="Spanish" data-speech="es-ES">Spanish</option>
          <option value="French" data-speech="fr-FR">French</option>
          <option value="German" data-speech="de-DE">German</option>
          <option value="Portuguese" data-speech="pt-BR">Portuguese</option>
          <option value="Arabic" data-speech="ar-SA">Arabic</option>
          <option value="Chinese" data-speech="zh-CN">Chinese</option>
          <option value="Japanese" data-speech="ja-JP">Japanese</option>
          <option value="Korean" data-speech="ko-KR">Korean</option>
          <option value="Russian" data-speech="ru-RU">Russian</option>
        </select>
      </label>
      <label>Level
        <select id="level">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>
    </div>
    <textarea id="text" placeholder="e.g. मैं कल अपने दोस्त से मिलने जा रहा हूँ  /  main kal apne dost se milne ja raha hoon"></textarea>
    <div class="row">
      <button class="primary" id="go">Explain in English</button>
      <button class="ghost" id="mic" type="button" title="Speak your sentence">🎤 Speak</button>
    </div>
    <p class="hint" id="micHint"></p>
  </section>

  <div id="out"></div>

  <section class="card" id="historyCard" hidden>
    <h2>Recent sentences</h2>
    <ul class="clean" id="history"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- speech output (read English aloud) ----
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
const speakBtn = (text) => `<button class="speak" title="Listen" data-say="${esc(text)}">🔊</button>`;
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-say]");
  if (b) speak(b.dataset.say);
});

// ---- speech input (say a sentence in your language) ----
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!Rec) {
  $("mic").hidden = true;
  $("micHint").textContent = "Tip: voice input works in Chrome and Edge.";
}
$("mic").addEventListener("click", () => {
  if (rec) { rec.stop(); return; }
  const opt = $("language").selectedOptions[0];
  if (!opt.dataset.speech) {
    $("micHint").textContent = "Pick your language first so I can understand your voice.";
    return;
  }
  rec = new Rec();
  rec.lang = opt.dataset.speech;
  rec.interimResults = true;
  rec.onresult = (ev) => {
    $("text").value = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
  };
  rec.onerror = (ev) => { $("micHint").textContent = "Mic error: " + ev.error; };
  rec.onend = () => {
    rec = null;
    $("mic").classList.remove("rec");
    $("mic").textContent = "🎤 Speak";
    if ($("text").value.trim()) $("micHint").textContent = "Got it. Edit if needed, then press Explain.";
  };
  rec.start();
  $("mic").classList.add("rec");
  $("mic").textContent = "■ Stop";
  $("micHint").textContent = "Listening…";
});

// ---- history (kept only in this browser) ----
function loadHistory() {
  try { return JSON.parse(localStorage.getItem("ec-history") || "[]"); } catch { return []; }
}
function saveHistory(item) {
  const list = [item, ...loadHistory().filter((h) => h.original !== item.original)].slice(0, 15);
  try { localStorage.setItem("ec-history", JSON.stringify(list)); } catch {}
  renderHistory();
}
function renderHistory() {
  const list = loadHistory();
  $("historyCard").hidden = list.length === 0;
  $("history").innerHTML = list.map((h, i) =>
    `<li><button data-h="${i}">${esc(h.original)}</button><div class="hint">${esc(h.lesson.english)}</div></li>`).join("");
}
$("history").addEventListener("click", (e) => {
  const b = e.target.closest("[data-h]");
  if (!b) return;
  const h = loadHistory()[b.dataset.h];
  $("text").value = h.original;
  render(h.lesson);
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// ---- main request ----
async function explain() {
  const text = $("text").value.trim();
  if (!text) { $("text").focus(); return; }
  $("go").disabled = true;
  $("out").innerHTML = `<section class="card loading">Thinking about how to say this in English…</section>`;
  try {
    const res = await fetch("/api/explain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, language: $("language").value, level: $("level").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    render(data);
    saveHistory({ original: text, lesson: data });
  } catch (err) {
    $("out").innerHTML = `<div class="error">${esc(err.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
}
$("go").addEventListener("click", explain);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) explain();
});

function render(L) {
  $("out").innerHTML = `
  <section class="card">
    <span class="tag">${esc(L.detected_language)}</span>
    <h2 style="margin-top:10px">In English</h2>
    <p class="big">${esc(L.english)} ${speakBtn(L.english)}</p>
    <p class="lit">Word-for-word: “${esc(L.literal_meaning)}”</p>
  </section>

  <section class="card">
    <h2>Why it's framed this way</h2>
    <p><span class="tag">Pattern</span>${esc(L.structure.pattern)}</p>
    <p><span class="tag">Tense</span>${esc(L.structure.tense)}</p>
    <p style="margin-bottom:0">${esc(L.structure.explanation)}</p>
  </section>

  <section class="card">
    <h2>Piece by piece</h2>
    <table>
      <tr><th>Your words</th><th>English</th><th>Why</th></tr>
      ${L.breakdown.map((b) => `<tr><td>${esc(b.native)}</td><td><strong>${esc(b.english)}</strong></td><td>${esc(b.note)}</td></tr>`).join("")}
    </table>
  </section>

  <section class="card">
    <h2>Grammar you just used</h2>
    <ul class="clean">
      ${L.grammar_points.map((g) => `<li><strong>${esc(g.title)}</strong><div>${esc(g.explanation)}</div>
        <div class="example">${esc(g.example)} ${speakBtn(g.example)}</div></li>`).join("")}
    </ul>
  </section>

  <section class="card">
    <h2>Other ways to say it</h2>
    <ul class="clean">
      ${L.alternatives.map((a) => `<li><span class="tag">${esc(a.tone)}</span><strong>${esc(a.sentence)}</strong> ${speakBtn(a.sentence)}
        <div class="hint">${esc(a.when_to_use)}</div></li>`).join("")}
    </ul>
  </section>

  ${L.common_mistakes.length ? `
  <section class="card">
    <h2>Common mistakes to avoid</h2>
    <ul class="clean">
      ${L.common_mistakes.map((m) => `<li><span class="wrong">${esc(m.wrong)}</span> → <span class="right">${esc(m.right)}</span>
        <div class="hint">${esc(m.why)}</div></li>`).join("")}
    </ul>
  </section>` : ""}

  <section class="card">
    <h2>Your turn</h2>
    <p>Try saying this in English: <strong>${esc(L.practice.prompt)}</strong></p>
    <button class="ghost" id="reveal">Show answer</button>
    <div class="answer" id="answer"><span class="right">${esc(L.practice.answer)}</span> ${speakBtn(L.practice.answer)}</div>
  </section>`;
  $("reveal").addEventListener("click", () => $("answer").classList.add("show"));
}

renderHistory();
</script>
</body>
</html>
